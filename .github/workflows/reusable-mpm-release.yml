name: Reusable MPM Release

on:
  workflow_call:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: string
      notes:
        description: "Release notes / changes in this update"
        required: false
        default: ""
        type: string
      shouldBuildWebsiteDocumentation:
        description: "Build website documentation? (true/false)"
        required: true
        type: string
      shouldPackageForDistribution:
        description: "Package for distribution? (true/false)"
        required: true
        type: string
      documentationPackageSpecifier:
        description: "Exact documentation package, for example ClassDocumentation@1.3.0"
        required: false
        default: ""
        type: string
      shouldCheckWebsiteDocumentation:
        description: "Run the package documentation check before mutation"
        required: false
        default: false
        type: boolean
      documentationCheckTask:
        description: "Canonical build task used to verify documentation"
        required: false
        default: "docs:check"
        type: string
      shouldPromoteUnreleased:
        description: "Promote the nonempty Unreleased changelog section"
        required: false
        default: false
        type: boolean
    secrets:
      MPM_REPO_PAT:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_ROOT: ${{ runner.temp }}/mpm-release
      PREFLIGHT_PATH: ${{ runner.temp }}/mpm-release/preflight.json
      METADATA_PATH: ${{ runner.temp }}/mpm-release/release-metadata.json
      NOTES_PATH: ${{ runner.temp }}/mpm-release/legacy-notes.md
      RELEASE_BODY_PATH: ${{ runner.temp }}/mpm-release/release-body.md
      EXPORT_ROOT: ${{ runner.temp }}/mpm-release/export
      PILOT_ENABLED: ${{ inputs.documentationPackageSpecifier != '' || inputs.shouldCheckWebsiteDocumentation || inputs.shouldPromoteUnreleased }}
      BUMP_TYPE: ${{ inputs.bump }}
      SHOULD_BUILD_DOCUMENTATION: ${{ inputs.shouldBuildWebsiteDocumentation }}
      SHOULD_PACKAGE_FOR_DISTRIBUTION: ${{ inputs.shouldPackageForDistribution }}
      DOCUMENTATION_PACKAGE_SPECIFIER: ${{ inputs.documentationPackageSpecifier }}
      SHOULD_CHECK_DOCUMENTATION: ${{ inputs.shouldCheckWebsiteDocumentation }}
      DOCUMENTATION_CHECK_TASK: ${{ inputs.documentationCheckTask }}
      SHOULD_PROMOTE_UNRELEASED: ${{ inputs.shouldPromoteUnreleased }}

    steps:
      - name: Check out calling repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: my-repo

      - name: Check out immutable OceanKit workflow tools
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: OceanKitWorkflow
          persist-credentials: false

      - name: Check out writable OceanKit repository
        if: ${{ inputs.shouldPackageForDistribution == 'true' }}
        uses: actions/checkout@v6
        with:
          repository: JeffreyEarly/OceanKit
          ref: main
          path: OceanKitPublish
          token: ${{ secrets.MPM_REPO_PAT }}
          fetch-depth: 0

      - name: Record release notes safely
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          mkdir -p "$RELEASE_ROOT"
          printf '%s' "$RELEASE_NOTES" > "$NOTES_PATH"

      - name: Preflight release request
        env:
          SOURCE_REPOSITORY_ROOT: my-repo
          OCEANKIT_PUBLISH_ROOT: OceanKitPublish
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: OceanKitWorkflow/tools/preflight_mpm_release.sh

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025bU2
          cache: true

      - name: Prepare and validate release candidate
        uses: matlab-actions/run-command@v3
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        with:
          command: |
            sourceRoot = fullfile(pwd,"my-repo");
            workflowRoot = fullfile(pwd,"OceanKitWorkflow");
            releaseRoot = string(getenv("RELEASE_ROOT"));
            preflight = jsondecode(fileread(getenv("PREFLIGHT_PATH")));
            isPilot = strcmpi(getenv("PILOT_ENABLED"),"true");
            shouldBuild = strcmpi(getenv("SHOULD_BUILD_DOCUMENTATION"),"true");
            shouldPackage = strcmpi(getenv("SHOULD_PACKAGE_FOR_DISTRIBUTION"),"true");
            shouldCheck = strcmpi(getenv("SHOULD_CHECK_DOCUMENTATION"),"true");
            shouldPromote = strcmpi(getenv("SHOULD_PROMOTE_UNRELEASED"),"true");

            mpmAddRepository("OceanKit",workflowRoot);
            pkg = matlab.mpm.Package(sourceRoot);
            mpminstall(pkg,Prompt=false,Authoring=true);

            addpath(fullfile(workflowRoot,"tools"));
            addpath(fullfile(sourceRoot,"tools"));
            if isPilot
                addpath(fullfile(workflowRoot,"tools"),"-begin");
                specifier = string(getenv("DOCUMENTATION_PACKAGE_SPECIFIER"));
                if specifier ~= ""
                    oceankitrelease.installDocumentationPackage(specifier,repositoryRoot=workflowRoot);
                end
                if shouldCheck
                    oceankitrelease.runDocumentationCheck(sourceRoot,string(getenv("DOCUMENTATION_CHECK_TASK")));
                end
            else
                packageList = mpmlist;
                if ~any(string([packageList.Name]) == "ClassAnnotations")
                    mpminstall("ClassAnnotations",Prompt=false);
                end
                if ~any(string([packageList.Name]) == "ClassDocumentation")
                    mpminstall("ClassDocumentation",Prompt=false);
                end
            end

            options = struct;
            options.rootDir = sourceRoot;
            options.bumpType = string(getenv("BUMP_TYPE"));
            options.shouldBuildWebsiteDocumentation = shouldBuild;
            options.shouldPackageForDistribution = shouldPackage;
            if isPilot
                options.notesFile = string(getenv("NOTES_PATH"));
                options.shouldPromoteUnreleased = shouldPromote;
                options.shouldRequireDocumentationBuilder = shouldBuild;
                options.releaseDate = string(preflight.releaseDate);
                options.releaseBodyPath = string(getenv("RELEASE_BODY_PATH"));
                options.outputRoot = string(getenv("EXPORT_ROOT"));
            else
                options.notes = string(fileread(getenv("NOTES_PATH")));
            end
            optionCells = namedargs2cell(options);
            ci_release(optionCells{:});

            if isPilot
                exportRoot = string(getenv("EXPORT_ROOT"));
            else
                exportRoot = fullfile(sourceRoot,"dist");
            end
            releaseBodyPath = "";
            if shouldPromote
                releaseBodyPath = string(getenv("RELEASE_BODY_PATH"));
            elseif string(getenv("BUMP_TYPE")) ~= "none" && strlength(strtrim(string(fileread(getenv("NOTES_PATH"))))) > 0
                releaseBodyPath = string(getenv("NOTES_PATH"));
            end
            oceankitrelease.writeMetadata(string(getenv("METADATA_PATH")), ...
                mode=string(preflight.mode), ...
                workflowRef=string(preflight.workflowRef), ...
                workflowSha=string(preflight.workflowSha), ...
                sourceStartSha=string(preflight.sourceStartSha), ...
                repositoryRoot=sourceRoot, ...
                oldVersion=string(preflight.oldVersion), ...
                bumpType=string(preflight.bumpType), ...
                releaseDate=string(preflight.releaseDate), ...
                documentationChecked=shouldCheck, ...
                documentationBuilt=shouldBuild, ...
                unreleasedPromoted=shouldPromote, ...
                shouldPackageForDistribution=shouldPackage, ...
                exportRoot=exportRoot, ...
                releaseBodyPath=releaseBodyPath);

      - name: Report release candidate
        run: |
          jq . "$METADATA_PATH"
          {
            printf '### Validated release candidate\n\n'
            printf -- '- Workflow: `%s` (`%s`)\n' "$(jq -r .workflowRef "$METADATA_PATH")" "$(jq -r .workflowSha "$METADATA_PATH")"
            printf -- '- Package: `%s@%s`\n' "$(jq -r .packageName "$METADATA_PATH")" "$(jq -r .version "$METADATA_PATH")"
            printf -- '- Distribution created: `%s`\n' "$(jq -r .distributionCreated "$METADATA_PATH")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish validated release candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$(jq -r .distributionCreated "$METADATA_PATH")" == "true" ]]; then
            OceanKitWorkflow/tools/publish_mpm_release.sh "$METADATA_PATH" my-repo OceanKitPublish
          else
            OceanKitWorkflow/tools/publish_mpm_release.sh "$METADATA_PATH" my-repo
          fi

      - name: Report and clean ephemeral checkouts
        if: always()
        run: |
          for repository in my-repo OceanKitPublish; do
            if [[ -d "$repository/.git" ]]; then
              printf '%s status before cleanup:\n' "$repository"
              git -C "$repository" status --short || true
              git -C "$repository" restore --staged --worktree . || true
              git -C "$repository" clean -ffdx || true
            fi
          done
          rm -rf "$RELEASE_ROOT"
